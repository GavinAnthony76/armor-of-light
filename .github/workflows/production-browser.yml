name: Production browser regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/production/**'
      - 'src/render/**'
      - 'src/audio/**'
      - 'public/assets/production/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/production-browser.yml'
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      ENGINE: ${{ matrix.engine }}
      FRAMES: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps $ENGINE
      - run: npm run build && npm run build:single
      - name: Sound codecs and fallback, web and offline
        run: npm run test:sfx-browser
      - name: Offline scenery and playable missing-art fallback
        if: ${{ !cancelled() }}
        run: npm run test:scenery-offline
      - name: Guardian calibration
        if: ${{ !cancelled() }}
        run: npm run test:calibration-browser
      - name: Single-page scenery soak and recovery
        if: ${{ !cancelled() }}
        run: npm run test:scenery-journey
      - name: Exact background occlusion framebuffer comparisons
        if: ${{ !cancelled() }}
        run: npm run test:background-occlusion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-${{ matrix.engine }}
          path: generated-artifacts/
