<!doctype html><meta charset="utf-8"><title>Offline Eliam atlas rasterizer</title>
<body><output id="status">starting</output><script>
const POSES = /*POSE_DATA*/;
const CELL = 512, PIVOT = {x:256,y:448}, HIP_SRC = {x:256,y:328};
const order = ['idle','run','block','hurt','dead','jump-rise','jump-fall','dash',
  'attack.hammer.light-1','attack.hammer.light-2','attack.hammer.light-3','attack.hammer.heavy','attack.hammer.air','attack.hammer.air-heavy'];
const rad = Math.PI / 180;
function partFrom(base, mask) {
  const c=document.createElement('canvas'); c.width=CELL;c.height=CELL;
  const x=c.getContext('2d'); x.drawImage(base,0,0); x.globalCompositeOperation='destination-in';
  x.fillStyle='#fff';x.beginPath();mask(x);x.fill();x.globalCompositeOperation='source-over';return c;
}
function weightedCenter(data,x0,x1,y0,y1) {
  let sx=0,sy=0,sw=0;const w=data.width,d=data.data;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const a=d[(y*w+x)*4+3]/255;if(a>.15){sx+=x*a;sy+=y*a;sw+=a;}}
  return sw?{x:sx/sw,y:sy/sw}:{x:(x0+x1)/2,y:(y0+y1)/2};
}
function mapSegment(ctx,img,a,b,A,B) {
  const sx=b.x-a.x,sy=b.y-a.y,tx=B.x-A.x,ty=B.y-A.y;
  const sl=Math.hypot(sx,sy)||1,tl=Math.hypot(tx,ty)||1;
  ctx.save();ctx.translate(A.x,A.y);ctx.rotate(Math.atan2(ty,tx)-Math.atan2(sy,sx));ctx.scale(tl/sl,tl/sl);
  ctx.drawImage(img,-a.x,-a.y);ctx.restore();
}
function legPoints(p,a,k) {
  const hip={x:0,y:-30+p.bob};
  const knee={x:hip.x+Math.sin(a)*15,y:hip.y+Math.cos(a)*15};
  const sa=a-k,foot={x:knee.x+Math.sin(sa)*15,y:knee.y+Math.cos(sa)*15};
  const px=v=>({x:PIVOT.x+v.x*4,y:PIVOT.y+v.y*4});
  return [px(hip),px(knee),px(foot)];
}
function drawFrame(ctx, parts, joints, phase, pose, movement) {
  const p={...pose};
  // Subtle secondary breathing maintains non-static four-frame clips even in
  // states whose procedural joint pose is intentionally held constant.
  const wave=Math.sin(phase*Math.PI*2), wave2=Math.cos(phase*Math.PI*2);
  p.bob += wave*.2; p.lean += wave*.012; p.head += wave2*.02;
  ctx.clearRect(0,0,CELL,CELL);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  for(const [part,a,k] of [[parts.back,p.hipB,p.kneeB],[parts.front,p.hipF,p.kneeF]]){
    const [A,K,F]=legPoints(p,a,k);
    mapSegment(ctx,part.upper,part.hip,part.knee,A,K);
    mapSegment(ctx,part.lower,part.knee,part.foot,K,F);
  }
  const hip={x:PIVOT.x,y:PIVOT.y+(-30+p.bob)*4};
  ctx.save();ctx.translate(hip.x,hip.y);ctx.rotate(p.lean);ctx.drawImage(parts.torso,-HIP_SRC.x,-HIP_SRC.y);ctx.restore();
  const neckX=Math.sin(p.lean)*22, neckY=-30+p.bob-Math.cos(p.lean)*22;
  const headX=neckX+Math.sin(p.lean+p.head)*9,headY=neckY-Math.cos(p.lean+p.head)*9;
  const targetHead={x:PIVOT.x+headX*4,y:PIVOT.y+headY*4};
  ctx.save();ctx.translate(targetHead.x,targetHead.y);ctx.rotate(p.lean*.6+p.head);ctx.drawImage(parts.head,-joints.head.x,-joints.head.y);ctx.restore();
}
async function build(){
  const status=document.getElementById('status');
  const im=new Image();im.src='/base.png';await im.decode();
  const base=document.createElement('canvas');base.width=CELL;base.height=CELL;base.getContext('2d').drawImage(im,0,0);
  const pixels=base.getContext('2d').getImageData(0,0,CELL,CELL);
  const bounds=weightedCenter(pixels,198,315,184,448);
  // Four overlapping, body-only patches; art arm cutouts are already transparent.
  const parts={
    head:partFrom(base,c=>c.rect(205,184,110,88)),
    torso:partFrom(base,c=>c.rect(203,229,112,132)),
    back:{},front:{}
  };
  for(const [name,x0,x1] of [['back',205,258],['front',254,310]]){
    const box=(y0,y1)=>c=>c.rect(x0,y0,x1-x0,y1-y0);
    parts[name].upper=partFrom(base,box(315,397));parts[name].lower=partFrom(base,box(382,448));
    parts[name].hip=weightedCenter(pixels,x0,x1,322,342);
    parts[name].knee=weightedCenter(pixels,x0,x1,378,397);
    parts[name].foot=weightedCenter(pixels,x0,x1,432,448);
  }
  parts.head=parts.head;
  const headPixels=parts.head.getContext('2d').getImageData(0,0,CELL,CELL);
  parts.headCenter=weightedCenter(headPixels,205,315,184,272);
  const atlas=document.createElement('canvas');atlas.width=4096;atlas.height=3584;
  const out=atlas.getContext('2d');out.clearRect(0,0,atlas.width,atlas.height);
  const frameCanvas=document.createElement('canvas');frameCanvas.width=CELL;frameCanvas.height=CELL;
  const fctx=frameCanvas.getContext('2d');
  for(let si=0;si<order.length;si++){
    const name=order[si],clip=POSES[name];
    for(let fi=0;fi<4;fi++){
      const phase=fi/4;
      drawFrame(fctx,parts,{head:parts.headCenter},phase,clip.poses[fi],name);
      const row=Math.floor(si/2), group=si%2, cellIndex=row*8+group*4+fi;
      out.drawImage(frameCanvas,(cellIndex%8)*CELL,Math.floor(cellIndex/8)*CELL);
    }
  }
  const blob=await new Promise(resolve=>atlas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('Canvas PNG export failed');
  const response=await fetch('/atlas',{method:'POST',headers:{'Content-Type':'image/png'},body:blob});
  if(!response.ok)throw new Error('Atlas write failed: '+response.status);
  status.textContent='DONE '+await response.text();
}
build().catch(e=>{document.getElementById('status').textContent='ERROR '+e.stack;console.error(e)});
</script></body>
