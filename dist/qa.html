<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armor of Light viewport QA</title><style>body{margin:0;background:#090f19;color:#eadabc;font:14px system-ui}header{padding:8px;display:flex;gap:10px;align-items:center}select,a{color:#fff;background:#242e42;padding:7px;border:1px solid #63718a}iframe{display:block;margin:auto;border:1px solid #778090;max-width:none}p{font-size:11px;margin:4px 12px}</style></head><body><header>Browser emulation <select id="size"><option value="1100,660">Desktop 1100 × 660</option><option value="390,844">Phone portrait 390 × 844</option><option value="844,390">Phone landscape 844 × 390</option><option value="320,568">Small phone 320 × 568</option><option value="667,375">Landscape 667 × 375</option></select><button id="normal">Normal play / fixtures</button></header><p>Browser viewport emulation only; does not certify physical phone/controller audio, safe areas or performance.</p><iframe id="view" title="Game viewport" width="1100" height="660" src="./?debug&qa"></iframe><script>const frame=document.querySelector('iframe');let fixtures=true;let phone=false;document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h;const nextPhone=+w<900;if(nextPhone!==phone){phone=nextPhone;frame.src=(fixtures?'./?debug&qa':'./?plain')+(phone?'&touch':'');}};document.querySelector('#normal').onclick=()=>{fixtures=!fixtures;frame.src=(fixtures?'./?debug&qa':'./?plain')+(phone?'&touch':'');};</script></body></html>
